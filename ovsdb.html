const KIND_COLOR = { key: '#e53e3e', value: '#3182ce' };
const cy = cytoscape({
  container: document.getElementById('cy'),
  wheelSensitivity: 0.2,
  style: [
    // 节点 = 内联 SVG 画的 record（表头行 + 字段行，行高固定便于锚点计算）
    { selector: 'node', style: {
      'shape': 'rectangle', 'label': '',
      'width': n => n.data('w'), 'height': n => n.data('h'),
      'background-image': n => n.data('svg'),
      'background-width': '100%', 'background-height': '100%',
      'border-width': 0,
    }},
    { selector: 'edge', style: {
      'width': 1.5, 'line-color': '#a0aec0', 'target-arrow-shape': 'triangle',
      'target-arrow-color': '#a0aec0',
      // taxi 不支持行级锚点（会回退到节点中心），用直线保证端点钉在字段行上
      'curve-style': 'straight',
      // 端点锚在字段行（源）/表头行（目标）的边缘中点，仿 dot 的 port 效果
      'source-endpoint': e => e.data('sep'), 'target-endpoint': e => e.data('tep'),
    }},
    { selector: 'edge[kind="key"]',   style: { 'line-color': KIND_COLOR.key,   'target-arrow-color': KIND_COLOR.key } },
    { selector: 'edge[kind="value"]', style: { 'line-color': KIND_COLOR.value, 'target-arrow-color': KIND_COLOR.value, 'line-style': 'dashed' } },
    { selector: 'edge[weak]',   style: { 'line-style': 'dotted' } },
    { selector: '.highlight', style: { 'border-width': 3, 'border-color': '#dd6b20' } },
    { selector: '.hidden', style: { 'display': 'none' } },
  ],
  layout: { name: 'elk', elk: {
    'algorithm': 'layered',
    'elk.direction': 'RIGHT',
    'elk.spacing.nodeNode': 30,
    'elk.layered.spacing.nodeNodeBetweenLayers': 80,
    'elk.edgeRouting': 'SPLINES',
  }},
});

    if (!a) return '';
    if (typeof a === 'string') return a;
    if (a.refTable) return 'uuid→' + a.refTable + (a.refType === 'weak' ? '(weak)' : '');
    return a.type || '';
  };
  let s = t.value ? '{' + atom(t.key) + ': ' + atom(t.value) + '}' : atom(t.key);
  if (t.max !== undefined && t.max !== 1) s = '[' + s + ']';
  return s;
}

const select = document.getElementById('schema-select');
function refreshSelect() {
  select.innerHTML = SCHEMAS.map((s, i) => `<option value="${i}">${s.name}</option>`).join('');
}

// record 行高为常量：表头 26px，字段行 22px；锚点按此精确换算
const HEADER_H = 26, ROW_H = 22;

const measureCtx = document.createElement('canvas').getContext('2d');
measureCtx.font = '13px system-ui, sans-serif';

function nodeSize(name, fields) {
  const wText = Math.max(measureCtx.measureText(name).width,
    ...fields.map(f => measureCtx.measureText(f).width), 0);
  return { w: Math.ceil(wText) + 24, h: HEADER_H + fields.length * ROW_H };
}

function nodeSVG(name, fields, w, h) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const font = 'font-size="13" font-family="system-ui,sans-serif"';
  let s = `<rect x="0.5" y="0.5" width="${w-1}" height="${h-1}" fill="#ffffff" stroke="#45b39d"/>`;
  s += `<rect x="0.5" y="0.5" width="${w-1}" height="${HEADER_H-1}" fill="#76d7c4" stroke="#45b39d"/>`;
  s += `<text x="${w/2}" y="17" text-anchor="middle" ${font} fill="#1a202c">${esc(name)}</text>`;
  fields.forEach((f, i) => {
    const y = HEADER_H + i * ROW_H;
    s += `<line x1="0.5" y1="${y}" x2="${w-0.5}" y2="${y}" stroke="#45b39d"/>`;
    s += `<text x="8" y="${y+15}" ${font} fill="#2d3748">${esc(f)}</text>`;
  });
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">${s}</svg>`);
}

// 某行纵向中心相对节点中心的高度百分比（cytoscape 端点百分比的基准）
function rowPct(h, idx) {
  const y = idx < 0 ? HEADER_H / 2 : HEADER_H + idx * ROW_H + ROW_H / 2;
  return (((y - h / 2) / h) * 100).toFixed(2) + '%';
}

function render(schema) {
  restore();
  cy.elements().remove();
  savedPos = null;
  // 节点 = 表名 + 含外链的列（record 行），无关联字段不显示
  const refCols = {};
  schema.edges.forEach(e => (refCols[e.source] ??= []).push(e.label));
  const byId = {};
  schema.nodes.forEach(n => {
    // 默认只显示含外链的列；勾选“显示全部字段”时按 schema 列序全量展示
    const fields = document.getElementById('show-all').checked
      ? n.columns.map(c => c.name)
      : [...new Set(refCols[n.id] || [])];
    const { w, h } = nodeSize(n.id, fields);
    byId[n.id] = { data: {
      id: n.id, root: !!n.root, columns: n.columns, fields, w, h,
      svg: nodeSVG(n.id, fields, w, h),
    }};
  });
  cy.add(Object.values(byId));
  cy.add(schema.edges.map((e, i) => {
    const src = byId[e.source].data, dst = byId[e.target].data;
    return { data: {
      id: 'e' + i, source: e.source, target: e.target,
      label: e.label, kind: e.kind, weak: !!e.weak,
      sep: '50% ' + rowPct(src.h, src.fields.indexOf(e.label)),
      tep: '-50% ' + rowPct(dst.h, -1),
    }};
  }));
  cy.layout(layoutOpts()).run();
}

function showInfo(node) {
  const d = node.data();
  const rows = d.columns.map(c =>
    `<tr><td class="${c.index ? 'idx' : ''}">${c.name}${c.index ? ' ◆' : ''}</td><td>${typeStr(c.type)}</td></tr>`
  ).join('');
  const info = document.getElementById('info');
  info.innerHTML = `<h3>${d.id}${d.root ? ' (root)' : ''}</h3><table>${rows}</table>`;
  info.style.display = 'block';
}

// 聚焦时仅对闭包子图重新布局；还原时恢复缓存的全局布局，避免跳变。
// 不能开 animate：layoutstop 在动画开始时触发，会缓存到动画前的旧坐标
let savedPos = null, focusing = false, focusEles = null;
const layoutOpts = () => ({ name: 'elk', elk: cy.options().layout.elk });
// ELK 看不到行级锚点，星型结构下任何目标顺序在它模型里都是零交叉；
// 让它尊重模型顺序，由我们按字段行序喂节点（见 focusOrder）
const focusLayoutOpts = () => ({ name: 'elk', elk: {
  ...cy.options().layout.elk,
  'elk.layered.considerModelOrder.strategy': 'NODES_AND_EDGES',
  'elk.layered.crossingMinimization.forceNodeModelOrder': true,
}});

// 从焦点节点 BFS，每个节点的后继按其连接字段的行序访问，
// 使节点发现顺序 ≈ 各层目标应处的垂直顺序
function focusOrder(start, keep) {
  const seen = new Set([start.id()]);
  const order = [start];
  const queue = [start];
  while (queue.length) {
    const n = queue.shift();
    const outs = n.outgoers('edge').filter(e => keep.has(e));
    outs.sort((a, b) => n.data('fields').indexOf(a.data('label')) - n.data('fields').indexOf(b.data('label')));
    for (const e of outs) {
      const t = e.target();
      if (!seen.has(t.id())) { seen.add(t.id()); order.push(t); queue.push(t); }
    }
    for (const e of n.incomers('edge').filter(e => keep.has(e))) {
      const s = e.source();
      if (!seen.has(s.id())) { seen.add(s.id()); order.push(s); queue.push(s); }
    }
  }
  return order;
}

cy.on('layoutstop', () => {
  if (focusing && focusEles) cy.fit(focusEles, 40);
  else savePositions();
});
function savePositions() {
  savedPos = {};
  cy.nodes().forEach(n => savedPos[n.id()] = { ...n.position() });
}

function restore() {
  focusing = false;
  focusEles = null;
  cy.elements().removeClass('highlight hidden');
  if (savedPos) {
    cy.nodes().positions(n => savedPos[n.id()]);
    cy.fit(null, 40);
  }
  document.getElementById('info').style.display = 'none';
}

// successors/predecessors 为递归（传递闭包）语义
cy.on('tap', 'node', e => {
  restore();
  const keep = e.target.successors().union(e.target.predecessors()).union(e.target);
  focusing = true;
  focusEles = keep;
  e.target.addClass('highlight');
  cy.elements().difference(keep).addClass('hidden');
  const ordered = cy.collection().union(focusOrder(e.target, keep)).union(keep.edges());
  ordered.layout(focusLayoutOpts()).run();
  showInfo(e.target);
});
cy.on('tap', e => { if (e.target === cy) restore(); });

select.onchange = () => render(SCHEMAS[select.value]);
document.getElementById('show-all').onchange = () => render(SCHEMAS[select.value]);

document.getElementById('file-input').onchange = async e => {
  for (const f of e.target.files) {
    try { SCHEMAS.push(JSON.parse(await f.text())); }
    catch (err) { alert(`${f.name}: ${err.message}`); }
  }
  e.target.value = '';
  refreshSelect();
  select.value = SCHEMAS.length - 1;
  render(SCHEMAS[select.value]);
};

if (SCHEMAS.length) { refreshSelect(); render(SCHEMAS[0]); }
</script>
</body>
</html>
